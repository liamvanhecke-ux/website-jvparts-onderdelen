<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="images/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="images/jv-parts-tab.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JV-Parts Bestelling</title>
</head>

<body>
    <div id="overlay"></div>
    <aside id="sidebar">
        <div class="sidebar-logo">JV<span>Parts</span></div>
        <nav>
            <a href="index.html">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" />
                    <path d="M9 21V12h6v9" />
                </svg> <span data-i18n="nav.home">Homepagina</span> </a>
            <a href="contact.html">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg> <span data-i18n="nav.contact">Contact</span> </a>
            <a href="winkelmand.html" id="sidebar-cart-link">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="9" cy="21" r="1" />
                    <circle cx="20" cy="21" r="1" />
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
                </svg> <span data-i18n="nav.cart">Winkelmand</span> <span class="cart-badge" id="cart-count-sidebar">0</span>
            </a>
        </nav>
        <div class="sidebar-close" id="sidebar-close">&#10005; &nbsp;<span data-i18n="nav.closeMenu">Sluit menu</span></div>
    </aside>
    <header id="topbar">
        <button id="hamburger" aria-label="Menu openen">
            <span></span><span></span><span></span>
        </button>
        <a href="index.html" class="topbar-brand">JV Parts</a>
        <div class="topbar-search">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" data-i18n-placeholder="common.searchPlaceholder" placeholder="Zoek onderdelen...">
        </div>
        <div class="taal-switcher">
            <button class="taal-knop" data-taal="nl">NL</button>
            <button class="taal-knop" data-taal="fr">FR</button>
            <button class="taal-knop" data-taal="de">DE</button>
        </div>
        <a href="winkelmand.html" class="topbar-cart" data-i18n-aria-label="nav.cart" aria-label="Winkelmand">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="9" cy="21" r="1" />
                <circle cx="20" cy="21" r="1" />
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
            <span class="dot" id="cart-count-top">0</span>
        </a>
    </header>
    <!-- Stappen -->
    <div class="stappen stappen-groot">
        <span class="stap">
            <a class="stap-link" href="winkelmand.html">
                <span class="stap-nummer voltooid">&#10003;</span>
                <span class="stap-label voltooid" data-i18n="steps.cart">winkelmand</span>
            </a>
        </span>
        <span class="pijl">›</span>
        <span class="stap">
            <a class="stap-link" href="checkout.html">
                <span class="stap-nummer voltooid">&#10003;</span>
                <span class="stap-label voltooid" data-i18n="steps.details">gegevens</span>
            </a>
        </span>
        <span class="pijl">›</span>
        <span class="stap">
            <a class="stap-link" href="betalen.html">
                <span class="stap-nummer voltooid">&#10003;</span>
                <span class="stap-label voltooid" data-i18n="steps.pay">betalen</span>
            </a>
        </span>
        <span class="pijl">›</span>
        <span class="stap">
            <span class="stap-nummer actief">4</span>
            <span class="stap-label actief" data-i18n="steps.done">klaar</span>
        </span>
    </div>
    <div class="checkout-layout" style="grid-template-columns:1fr;max-width:560px;margin:0 auto;">
        <div class="checkout-form-card" style="text-align:center;padding:32px 24px;">
            <div
                 style="margin:0 auto 16px;width:56px;height:56px;border-radius:50%;background:var(--success-bg);display:flex;align-items:center;justify-content:center;">
                <svg width="28" height="28" fill="none" stroke="var(--success)" stroke-width="2.5" viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
            </div>
            <h3 id="klaar-status" data-i18n="klaar.processing">Bestelling verwerken...</h3>
            <div id="klaar-details" class="gegevens-check" style="margin-top:18px;text-align:left;"></div>
            <a href="index.html" class="cart-continue" data-i18n="klaar.continueShopping" style="justify-content:center;margin-top:20px;">&#8592; Verder
                winkelen</a>
        </div>
    </div>
    <footer id="foot">&copy; 2026 <span>JV-Parts</span> <span data-i18n="common.footer">Alle rechten voorbehouden</span></footer>
    <div id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/klaar.js"></script>
</body>

</html>
