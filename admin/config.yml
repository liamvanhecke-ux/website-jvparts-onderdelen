backend:
  name: git-gateway
  branch: main

media_folder: "images/products"
public_folder: "/images/products"

locale: "nl"

collections:
  - name: "winkel"
    label: "Winkel"
    files:
      - name: "producten"
        label: "Producten beheren"
        file: "data/products.json"
        description: "Voeg producten toe, pas ze aan, sleep om te herordenen of verwijder met de ✕. Rechts zie je meteen hoe het in de winkel toont."
        fields:
          - label: "Producten"
            name: "products"
            widget: "list"
            label_singular: "Product"
            summary: "{{fields.name}} €{{fields.price}}"
            add_to_top: true
            fields:
              - label: "Naam"
                name: "name"
                widget: "string"
                hint: "Bijv. Cilinderset 50cc"
              - label: "Naam (Frans)"
                name: "name_fr"
                widget: "string"
                required: false
                hint: "Optioneel. Wordt getoond aan bezoekers die de site in het Frans bekijken. Leeg = de Nederlandse naam wordt getoond."
              - label: "Naam (Duits)"
                name: "name_de"
                widget: "string"
                required: false
                hint: "Optioneel. Wordt getoond aan bezoekers die de site in het Duits bekijken. Leeg = de Nederlandse naam wordt getoond."
              - label: "Merk / Subtitel"
                name: "subtitle"
                widget: "string"
                hint: "Bijv. Honda / Peugeot of Universeel"
              - label: "Merk / Subtitel (Frans)"
                name: "subtitle_fr"
                widget: "string"
                required: false
                hint: "Optioneel. Leeg = de Nederlandse tekst wordt getoond."
              - label: "Merk / Subtitel (Duits)"
                name: "subtitle_de"
                widget: "string"
                required: false
                hint: "Optioneel. Leeg = de Nederlandse tekst wordt getoond."
              - label: "Prijs"
                name: "price"
                widget: "string"
                hint: "Alleen het bedrag, met komma. Bijv. 34,95 het euroteken wordt automatisch getoond."
                pattern:
                  ['^\d+([.,]\d{1,2})?$', "Gebruik enkel cijfers, bijv. 34,95"]
              - label: "Categorie"
                name: "category"
                widget: "relation"
                collection: "categorieen"
                search_fields: ["name"]
                value_field: "name"
                display_fields: ["name"]
                required: false
                hint: "Begin te typen en kies een categorie uit de lijst. Een nieuwe nodig? Maak ze aan onder 'Categorieën' (links in het menu)."
              - label: "Categorie (Frans)"
                name: "category_fr"
                widget: "string"
                required: false
                hint: "Optioneel. De vertaling van de categorienaam hierboven, voor de filterknop in het Frans. Leeg = de Nederlandse naam wordt getoond."
              - label: "Categorie (Duits)"
                name: "category_de"
                widget: "string"
                required: false
                hint: "Optioneel. De vertaling van de categorienaam hierboven, voor de filterknop in het Duits. Leeg = de Nederlandse naam wordt getoond."
              - label: "Staat"
                name: "condition"
                widget: "select"
                options: ["Nieuw", "Tweedehands"]
                default: "Nieuw"
                required: false
                hint: "Is dit onderdeel nieuw of tweedehands (occasie)? Verschijnt als filter op de site."
              - label: "Afbeelding"
                name: "image"
                widget: "image"
                required: false
                hint: "Optioneel. Geen foto? Dan toont de site een nette placeholder."

  - name: "categorieen"
    label: "Categorieën"
    label_singular: "Categorie"
    folder: "data/categorieen"
    create: true
    delete: true
    identifier_field: "name"
    summary: "{{fields.name}}"
    editor:
      preview: false
    fields:
      - label: "Naam"
        name: "name"
        widget: "string"
        hint: "Bijv. Banden. Deze naam verschijnt als keuze bij een product en als filter op de site."
