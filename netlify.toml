[build]
  publish = "."
 
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
 
# Voorkom dat de broncode van de functies rechtstreeks als tekstbestand
# opvraagbaar is (bv. https://.../netlify/functions/create-checkout-session.js).
# De echte functie-aanroepen lopen via /.netlify/functions/... en blijven werken.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Beveiligingsheaders die overal gelden, ook op /admin: ze zeggen niets over
# wélke scripts/stijlen mogen laden, dus ze kunnen Decap CMS niet breken.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Content-Security-Policy: enkel op de klantpagina's, expliciet per pad
# (niet via /*), zodat /admin (Decap CMS, die eigen workers/afbeeldingen
# via blob:/data: laadt) hier gegarandeerd buiten valt.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://api.zippopotam.us https://identity.netlify.com https://api.netlify.com; frame-src https://www.openstreetmap.org; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

